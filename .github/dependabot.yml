version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "build(deps)"
    groups:
      sqlite-stack:
        applies-to: version-updates
        patterns:
          - "modernc.org/sqlite"
          - "modernc.org/libc"
        update-types:
          - minor
          - patch
      wails-stack:
        applies-to: version-updates
        patterns:
          - "github.com/wailsapp/*"
          - "github.com/leaanthony/*"
        update-types:
          - minor
          - patch
      golang-x-patches:
        applies-to: version-updates
        patterns:
          - "golang.org/x/*"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build(deps)"
    groups:
      svelte-toolchain:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/vite-plugin-svelte"
          - "vite"
        update-types:
          - minor
          - patch
      frontend-quality-tooling:
        applies-to: version-updates
        patterns:
          - "@biomejs/biome"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch
