version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      svelte-toolchain:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/vite-plugin-svelte"
          - "vite"
        update-types:
          - minor
          - patch
      frontend-quality-tooling:
        applies-to: version-updates
        patterns:
          - "@biomejs/biome"
        update-types:
          - minor
          - patch
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "svelte"
          - "@sveltejs/vite-plugin-svelte"
          - "vite"
          - "@biomejs/biome"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "svelte"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@biomejs/biome"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
