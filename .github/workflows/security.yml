name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Go modules
        run: go mod verify
      - name: Prepare non-production frontend embed input
        run: |
          # govulncheck loads package main, so go:embed needs a non-empty
          # frontend/dist. File contents do not affect the Go call graph.
          mkdir -p frontend/dist
          printf '<!doctype html><title>govulncheck embed placeholder</title>\n' > frontend/dist/index.html
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Scan reachable Go vulnerabilities
        run: ./scripts/run-govulncheck.sh
