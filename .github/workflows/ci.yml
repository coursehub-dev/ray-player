name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check Go formatting
        run: ./scripts/check-go-format.sh
      - name: Check frontend formatting and lint
        run: npm --prefix frontend run check
      - name: Verify Go modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Go tests
        run: go test -count=1 -cover ./...
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Frontend production build
        run: npm --prefix frontend run build

  artifact-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create artifact payload
        run: printf 'ray-player-artifact-smoke\n' > artifact-smoke.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifact-smoke
          path: artifact-smoke.txt
          if-no-files-found: error
          retention-days: 1
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-artifact-smoke
          path: downloaded
      - name: Verify artifact round-trip
        run: cmp artifact-smoke.txt downloaded/artifact-smoke.txt

  native-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin/arm64
          - os: windows-2025
            target: windows/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Compile native application
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.target }}" in
            windows/*)
              wails build -clean -platform "${{ matrix.target }}" -webview2 embed
              ;;
            *)
              wails build -clean -platform "${{ matrix.target }}"
              ;;
          esac
          git diff --exit-code -- frontend/wailsjs
