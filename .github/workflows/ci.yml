name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --strict-peer-deps
      - name: Check frontend dependency graph
        run: npm --prefix frontend run deps:check
      - name: Check Go formatting
        run: ./scripts/check-go-format.sh
      - name: Check frontend formatting and lint
        run: ./scripts/check-frontend-quality.sh
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Build frontend assets for Go embed
        run: npm --prefix frontend run build
      - name: Verify frontend embed artifact
        run: ./scripts/check-frontend-dist.sh
      - name: Verify Go modules
        run: go mod verify
      - name: Verify SQLite/libc module contract
        run: ./scripts/check-sqlite-libc-version.sh
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Vet
        run: go vet ./...
      - name: Go tests
        run: go test -count=1 -cover ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  artifact-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create artifact payload
        run: printf 'ray-player-artifact-smoke\n' > artifact-smoke.txt
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-smoke
          path: artifact-smoke.txt
          if-no-files-found: error
          retention-days: 1
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-artifact-smoke
          path: downloaded
      - name: Verify artifact round-trip
        run: cmp artifact-smoke.txt downloaded/artifact-smoke.txt

  native-compile:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin/arm64
          - os: windows-2025
            target: windows/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --strict-peer-deps
      - name: Install Wails CLI
        shell: bash
        run: ./scripts/install-wails-cli.sh
      - name: Compile native application
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.target }}" in
            windows/*)
              wails build -clean -platform "${{ matrix.target }}" -webview2 embed
              ;;
            *)
              wails build -clean -platform "${{ matrix.target }}"
              ;;
          esac
          git diff --exit-code -- frontend/wailsjs
