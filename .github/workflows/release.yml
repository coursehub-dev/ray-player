name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag exists
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

  macos:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --strict-peer-deps
      - name: Install matching Wails CLI
        shell: bash
        run: ./scripts/install-wails-cli.sh
      - name: Prepare portable runtime assets
        run: |
          go run ./cmd/ray_deps ffmpeg --install
          go run ./cmd/ray_deps onnxruntime
          go run ./cmd/ray_deps minilm
      - name: Build macOS arm64
        run: |
          wails build -clean -platform darwin/arm64
          go run ./cmd/ray_deps stage --build-dir build/bin
      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/ray-player1.app dist/ray-player1-darwin-arm64.zip
          shasum -a 256 dist/ray-player1-darwin-arm64.zip > dist/ray-player1-darwin-arm64.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ray-player1-darwin-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --strict-peer-deps
      - name: Install matching Wails CLI
        shell: bash
        run: ./scripts/install-wails-cli.sh
      - name: Prepare portable runtime assets
        run: |
          go run ./cmd/ray_deps ffmpeg --install
          go run ./cmd/ray_deps onnxruntime
          go run ./cmd/ray_deps minilm
      - name: Build Windows amd64
        run: |
          wails build -clean -platform windows/amd64 -webview2 embed
          go run ./cmd/ray_deps stage --build-dir build/bin
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/ray-player1.exe,build/bin/assets -DestinationPath dist/ray-player1-windows-amd64.zip -Force
          $hash = (Get-FileHash dist/ray-player1-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ray-player1-windows-amd64.zip" | Set-Content -NoNewline dist/ray-player1-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ray-player1-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
          fi
